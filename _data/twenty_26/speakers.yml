- name: "전규리"
  img: "전규리.jpg"
  alt: "전규리"
  subtitle: "MCT"
  org: "Microsoft"
  topic: "Microsoft와 Nvidia가 함께하는 퀴즈 세션"
  description: "Microsoft와 Nvidia가 협력 이후 필수적으로 알고 있어야 할 기술적 내용엔 대한 퀴즈 세션입니다. Microsoft AI 기술에 대한 내용도 함께 다루며, 약 10-13문제로 이루어진 퀴즈 세션으로 경품도 준비될 예정입니다."
