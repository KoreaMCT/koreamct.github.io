- name: "김진석"
  img: "김진석.jpg"
  alt: "김진석"
  subtitle: "MVP"
  org: "케이에이치시스템즈"
  topic: "해보려고 한 것이 하네스엔지니어링이라던데요?"
  description: "단순히 새로운 기술을 탐구하는 것이 아니라, \"어떻게 하면 AI에게 실무를 제대로 맡길 수 있을까?\"라는 본질적인 고민에서 시작된 세션입니다. <br>

                본 세션에서는 공장 자동화(MES) 프로젝트 현장에서 생산 실적 및 검사 기록 관리 업무를 수행하며 마주했던 한계점을 공유합니다. 시스템 가동 현황을 결국 사람이 일일이 확인해야 했던 번거로움을 해결하기 위해, '생산 관리 에이전트'를 설계하고 이를 품질 및 영업 영역까지 확장하고자 했던 시도를 소개합니다. <br>

                이러한 실무적 시나리오가 왜 '하네스 엔지니어링(Harness Engineering)'이라는 방법론과 연결되는지, 그리고 우리가 설계하는 에이전트가 현장에서 어떤 가치를 만들어낼 수 있는지 그 기술적 접점을 함께 모색해 보고자 합니다. <br>"
  bio: "KHSYSTEMS 대표로 회사를 운영하며, <br>
        ElasticSearch, .NET 등 오픈소스 기반의 SI 프로젝트를 중심으로 <br>
        작은 조직을 꾸려 다양한 비즈니스 문제를 해결하고 있습니다. <br>

        .NET과 Azure AI Service 분야에서 2년차 MVP로 활동 중이며, <br>
        기술 커뮤니티에 적응하고 기여하기 위해 꾸준히 노력하고 있습니다. <br>
        현재 커뮤니티에서는 .NET을 기반으로 활동하고 있으며, <br>
        특히 Blazor에 관심이 많지만 실무에서는 Java 기반 프로젝트를 주로 수행하고 있습니다. <br>

        Low Code를 비롯한 다양한 기술 영역에도 관심이 있으며, <br>
        특히 비즈니스와 연결되는 기술이라면 적극적으로 탐색하는 편입니다. <br>

        커뮤니케이션이 아주 능숙한 편은 아니지만 <br>
        열린 자세로 소통하려고 노력하고 있으니 편하게 이야기 걸어주세요. <br>"

