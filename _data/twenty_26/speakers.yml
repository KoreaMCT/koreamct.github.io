  description: "공장 자동화 프로젝트를 끝내고 이를 기반으로 AI를 이용해서 이것저것 시도해 보려고 합니다. 각 파트의 Agent가 역할을 좀 하도록 만들고 느낀 것에 대해서 공유하고 싶습니다."
