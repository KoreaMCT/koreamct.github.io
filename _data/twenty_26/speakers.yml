  topic: "문과생을 위한 L400 에이전트 만들기"
  description: "깃헙코파일럿에만 의존해 코드 한 줄 쓰지 않고 MCP 서버를 만듭니다. 그 MCP 서버를 도커로 가상화하고(옵셔널), 코파일럿 스튜디오에 붙입니다. 인문학적 감성으로만 에이전트를 만들어 봅시다."
  bio: "한국마이크로소프트에서 코파일럿 세일스하는 최정우입니다."

- name: "허석"
  img: "허석.jpg"
  alt: "허석"
  subtitle: "MVP"
  org: "드림아이시스템"
  topic: "AI-Driven Power BI: Build Easy Dashboards with MCP"
  description: "AI-Driven BI를 경험하세요! MCP를 통해 대시보드 제작을 자동화하는 법을 시연하며 같이 실습해봅니다. 라이선스 유무와 상관없이 AI로 모델링을 시작하는 법을 배우고, 라이선스 보유 시 얻을 수 있는 극대화된 실무 시너지를 확인하세요."
  bio: "저는 30년 동안 IT 인프라 관리자로 활동해 왔습니다. 프로그래밍 지식은 없지만, ChatGPT와 같은 손에 잡히는 모든 도구를 활용해 업무 효율성을 높이고 있어요. '경험 많은 야매 관리자'라고 불리며, 블로그를 통해 아이디어를 공유하고 업무 자동화를 추구합니다. IT 인프라 관리와 파워플랫폼 활용에 대한 노하우를 나누고 싶어요. 함께 토론하며 새로운 인사이트를 얻어봅시다!"
