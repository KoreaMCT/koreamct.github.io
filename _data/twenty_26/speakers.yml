- name: "김영욱"
  img: "김영욱.jpg"
  alt: "김영욱"
  subtitle: "MCT | MVP"
  org: "Hello AI"
  topic: "OpenClaw 써본 썰 푼 (Feat. Azure): 삽질부터 동작까지"
  description: "OpenClaw를 Microsoft Azure에서 실행하는 건 생각보다 어렵지 않았습니다.
                오히려 더 고민이 되었던 건, “이걸 어떻게 활용할 수 있을까?”였습니다. <br>

                이 세션에서는 설정 과정 대신, 실제 사용하면서 들었던 질문들을 중심으로 이야기합니다.
                이걸 내 일상에 어떻게 녹여낼 수 있을지, 클라우드에서 운영하는 의미는 무엇인지, 그리고 보안적으로 어디까지 신경 써야 하는지에 대한 고민을 공유합니다. <br>

                가볍게 시작한 프로젝트가, 결국 “왜 쓰는가”에 대한 고민으로 이어진 경험을 함께 나눕니다."
  bio: "(현) Hello AI 대표 <br>
    (전) Microsoft 엔지니어 (2008~2021) <br>
    (현) Microsoft Regional Director <br>
    (현) Microsoft AI MVP <br>
    (현) 국가과학기술인력개발원 객원 교수 <br>

    서울시립대학교 컴퓨터 과학 석사 <br>
    웹 접근성 2.0 표준 자문위원 <br>
    한국방송통신대학교 출강(2020년) <br>
    인천재능대학교 출강(2021년) <br>
    국가과학기술인력개발원 KIRD 최우수강사 2018, 2020 <br>"

