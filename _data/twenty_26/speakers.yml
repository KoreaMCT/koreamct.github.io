- name: "최영락"
  img: "최영락.jpg"
  alt: "최영락"
  subtitle: "MCT"
  org: "Independent / 커뮤니티 활동"
  topic: "오래 활동한 MCT의 비밀: 실력 향상, 커뮤니티, 그리고 본질"
  description: "왜 어떤 MCT는 오래 가고, 어떤 MCT는 금방 멈추는가? 이 세션은 16년 MCT 활동을 통해 얻은 핵심인 끊임없는 실력 향상, 커뮤니티 참여, 그리고 강의 본질 추구 3가지를 실제 경험과 함께 공유합니다. 직장 공백기에 강의가 실질적 기회가 되었던 이야기부터, 커뮤니티가 수강생 네트워킹으로 이어지는 선순환 구조까지, MCT로서 지속 가능한 방향을 함께 고민합니다."
  bio: "2009년부터 MCT 활동을 오래 기간 이어왔으며, MS 자격증 동호회 스텝으로 커뮤니티 운영에도 참여했습니다. 직장 공백기에 강의 활동으로 커리어를 이어간 경험을 포함해, MCT로서 오래 활동하기 위한 실질적인 방향을 현장 경험 기반으로 공유합니다."

- name: "최정우"
  img: "최정우.png"
