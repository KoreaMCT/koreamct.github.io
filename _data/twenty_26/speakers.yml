- name: "박민욱"
  img: "박민욱.jpeg"
  alt: "박민욱"
  subtitle: "MCT"
  org: "KT"
  topic: "BX: MCT 인프라 점검과 피지컬 최적화 전략"
  description: "MCT 인프라의 최적화와 효율, 그들의 생존과 실전, 습관과 변화를 위한 MCT BX (Body Transformation)의 첫 걸음!"
  bio: "기술로 세상을 바꾸는 MCT 여러분의 가장 든든한 건강 파트너가 되고 싶은 발표자입니다. <br>

        KT 인재실 AX교육팀에서 교육 기획을 하며 쌓은 노하우에 웨이트 트레이닝(트레이너), 수영(수상안전분야) 등 전문적인 체육 활동 경험을 더했습니다. <br>

        이번 세션에서는 단순한 이론이 아니라, 강사들의 삶의 질을 높일 수 있는 '생존 체력'과 '건강 전략'을 가족의 마음으로 전달하겠습니다. <br>"

- name: "박민진"
  img: "박민진.png"
  alt: "박민진"
  subtitle: "MCT"
  org: "MegazoneCloud"
  topic: "답답한 쿠버네티스 장애 추적, 로그 창 닫고 눈으로 확인하기 (feat. eBPF)"
  description: "최근 AI 워크로드가 급증함에 따라 쿠버네티스(K8s) 인프라의 복잡성도 함께 높아지고 있습니다. 장애가 발생했을 때 복잡한 로그를 뒤적이는 대신, 직관적으로 문제를 파악할 수 있는 방법은 없을까요? <br>

                본 세션에서는 애플리케이션 코드 변경 없이 eBPF와 Hubble을 활용하여 트래픽 병목을 시각화하는 방법을 가볍게 톺아봅니다. 쿠버네티스에 익숙하지 않은 분들도 이해하실 수 있도록 구성했으며, 인프라 분야 선배님들을 위해 Azure CNI 에 적용된 MS Retina도 함께 소개합니다."
  bio: "현재 메가존클라우드에서 Modernization Solutions Architect로 근무 중이며, 작년부터 MCT로 활동하고 있습니다. 주 강의 분야는 Azure, GitHub, SDLC입니다. <br>

        기존 클라우드 인프라를 넘어 'AI 기반 모던 인프라 아키텍처'로의 전환에 깊은 관심을 두고 있습니다. <br>

        이를 위해 Microsoft AOAI SDK Proxy 오픈소스에 기여했고, CNCF 유관 커뮤니티에서 AI/LLM 워크로드용 경량 eBPF 관측성(Observability) 에이전트 프로젝트에 참여하는 등, 클라우드 네이티브와 AI 생태계 발전을 따라잡고자 힘쓰고 있습니다."

- name: "배준오"
  img: "배준오.jpg"
  alt: "배준오"
  subtitle: "MVP"
  org: "스몰투빅"
  topic: "생성형AI 보다 더 좋은 강의자료 만들기"
  description: "생성형 AI를 활용하면 발표자료와 강의 슬라이드를 쉽고 빠르게 만들 수 있습니다. 하지만 기술교육과 같이 학습자의 집중과 이해를 높여야 하는 강의 자료는 사람이 직접 만들어야 합니다. 기술교육 자료의 본질은 단순한 정보 정리에 그치지 않습니다. 학습자의 이해, 기억, 그리고 행동변화(현업적용)를 설계하는 것이 핵심입니다. 본 발표에서는 학습설계자의 관점에서 학습자의 이해를 돕는 강의자료 작성법을 소개합니다."
  bio: "19년차 Microsoft MVP(PowerPoint)로 활동하고 있습니다. 기업교육, 역량 교육 및 컨설팅을 하고 있습니다."

- name: "안성진"
  img: "안성진.jpg"
  alt: "안성진"
  subtitle: "MCT"
  org: "Microsoft"
  topic: "MCT 프로그램 업데이트 및 MTM 등록 방법"
  description: "2026년 하반기 부터 변경 예정인 MCT 프로그램 관련 규정 및 소식과, MCT가 필수로 알아야 하는 MTM 등록 방법에 대해 살펴봅니다."
  bio: "안녕하세요. 신뢰할 수 있는 정보와 안정적인 소프트웨어 솔루션을 제공할 수 있는 사람이 되기 위해 하루 하루 살아가고 있는 안성진입니다."

- name: "유승호"
  img: "유승호.jpg"
  alt: "유승호"
  subtitle: "MCT"
  org: "Microsoft"
  topic: "AI 에이전트 첫발 – Microsoft Foundry, VS Code, 그리고 GitHub Copilot"
  description: "최근 AI 에이전트는 빠르게 발전하고 있지만, <br>
                처음 Microsoft Foundry를 접했을 때 <br>
                전체 개발 흐름을 한 번에 이해하기는 쉽지 않습니다. <br>

                이 시간에는 Microsoft Foundry를 출발점으로, <br>
                VS Code, AI Toolkit, GitHub Copilot까지 이어지는 <br>
                AI 에이전트 개발 흐름을 간단한 데모 중심으로 살펴봅니다. <br>

                Foundry에서 프로젝트와 에이전트를 생성하고, <br>
                다양한 최신 모델을 확인한 뒤 포털에서 직접 에이전트를 구성해봅니다. <br>

                그리고, Visual Studio Code의 Foundry Toolkit을 활용해 <br>
                로컬에서 리소스를 통합적으로 관리하고, <br>
                코드 기반으로 에이전트를 개발하는 과정을 다룹니다. <br>"

  bio: "현재 Microsoft Korea에서 Technical Trainer로 활동하며, <br>
        Azure Cloud, Azure AI, Azure DevOps, Visual Studio, .NET, C# 등 <br>
        Microsoft 개발자 플랫폼 전반에 깊은 관심을 가지고 있으며, <br>
        Developer 및 MCT 생태계와의 연결에도 지속적으로 기여하고 있습니다. <br>

        Facebook 커뮤니티 <br>
        ‘나는 개발자다’와 ‘Korea MCT’를 운영하며 <br>
        개발자 및 기술 커뮤니티 활성화에도 힘쓰고 있습니다. <br>

        과거 15년 연속 Microsoft MVP(2005–2019)로 선정되었으며, <br>
        3번의 스타트업을 운영한적이 있구요, <br>
        3남매의 아빠, 사랑하는 아내의 남편입니다. <br>"


- name: "유저스틴"
  img: "유저스틴.png"
  alt: "유저스틴"
  subtitle: "Microsoft"
  org: "Microsoft"
  topic: "Microsoft Agent Framework 및 Microsoft Foundry 기반 엔터프라이즈형 에이전틱 앱의 개발 및 배포를 손쉽게 할 수 있는 스타터 팩 소개"
  description: "지금까지 Microsoft Agent Framework(MAF) 또는 Microsoft Foundry 서비스를 소개하는 샘플 코드는 주로 Hello World 수준이었습니다. 이번에 Microsoft CoreAI 조직에서 제공하는 스타터 팩을 활용하면 MAF와 파운드리, MCP 서버 등을 Aspire로 오케스트레이션한 후 Azure Container Apps(ACA)로 한방에 배포할 수 있습니다. 이 세션에서는 MAF 및 파운드리 에이전트 서비스에 대해 소개하고 스타터 팩 적용 방법과 멀티 에이전트 오케스트레이션 패턴 구현 방법을 알아봅니다."
  bio: "Microsoft에서 Principal Developer Advocate로 일하고 있습니다. 자나깨나 개발자 생산성 향상을 위한 도구들을 찾거나 만들거나 공유합니다."

