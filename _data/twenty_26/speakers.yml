  topic: "\"Artist & Stage\" (부제: AI시대, 기술교육의 동반성장을 위한 KOSS와 MCT의 상생전략)"
  description: "MS는 원천기술과 시나리오를 제공하는 제작사의 역할을,  MCT는 그 시나리오와 기술을 태도로 맘껏 재량을 뽐내고 청중을 감동시키는 ‘아티스트’역할을, 그리고  KOSS는 무대를 기획하고, 관객을 매칭시키며, 아티스트들을 빛나게 하는 기획자의 역할을 합니다. <br>

                삼위일체(三位一體)가 되었을 때 비로소 바람직한 공연이 연출되고, 청중(고객)은 감동하며, 감동은 큰 물결을 이루게 된다는 것이 제가 주장하고자 하는 골자(骨子)입니다. <br>
                
                곧, 삼위가 동반 성장하는 첩경이라고 저는 판단하고 있습니다. <br>"
  bio: "한국소프트웨어서비스(Korea Software Service, 이하 KOSS) 영업대표"

- name: "최영락"
  img: "최영락.jpg"
