# Korea MCT Summit 2026 Schedule
# row types: "full" (spans both tracks) | "split" (two separate tracks)
# row classes for full rows: "keynote" | "sponsor" | "break" | "session"
#
# For rows/tracks that have a "speaker" field, the session title is looked up
# from _data/twenty_26/speakers.yml (speaker.topic) at render time.
# Use "title" only as a fallback when no matching speaker topic exists,
# or for non-speaker rows (sponsor, break, labels).
# Use "workshop: true" to prepend "(워크숍) " to the looked-up topic.

day1:
  title: "Day 1"
  date: "2026년 5월 29일 (금)"
  rows:
    - time: "10:00 ~ 10:20"
      type: "full"
      class: "keynote"
      title: "Keynote"
      speaker: "Rohan Kapoor"
    - time: "10:30 ~ 10:50"
      type: "full"
      class: "session"
      speaker: "정석원"  
    - time: "11:00 ~ 11:40"
      type: "split"
      track1:
        speaker: "William Zhang"
      track2:
        # topic is TBD — kept as fallback title
        speaker: "Joshua Jones"
    - time: "11:50 ~ 12:10"
      type: "full"
      class: "session"
      speaker: "김재수"
    - time: "12:10 ~ 13:30"
      type: "full"
      class: "meal"
      title: "점심 식사"
    - time: "13:30 ~ 14:10"
      type: "split"
      track1:
        speaker: "김진석"
      track2:
        speaker: "이소영"
    - time: "14:10 ~ 14:30"
      type: "full"
      class: "session"
      speaker: "박민욱" 
    - time: "14:50 ~ 15:30"
      type: "split"
      track1:
        speaker: "유승호"
      track2:
        speaker: "배준오"
    - time: "15:50 ~ 17:20"
      type: "split"
      track1:
        workshop: true
        speaker: "유저스틴"
      track2:
        workshop: true
        speaker: "최정우"

